     */
    window.onbeforeunload = () => {
        // 将播放信息用对象封装，并存入到localStorage中
        const playInfo = {
            index: ap.list.index,
            currentTime: ap.audio.currentTime,
            paused: ap.paused
        };
        localStorage.setItem("playInfo", JSON.stringify(playInfo));
    };

    /**
     * 页面加载后监听
     */
    window.onload = () => {
        // 从localStorage取出播放信息
        const playInfo = JSON.parse(localStorage.getItem("playInfo"));
        if (!playInfo) {
            return;
        }
        // 切换歌曲
        ap.list.switch(playInfo.index);
        // 等待500ms再执行下一步(切换歌曲需要点时间，不能立马调歌曲进度条)
        setTimeout(() => {
            // 调整时长
            ap.seek(playInfo.currentTime);
            // 是否播放
            if (!playInfo.paused) {
                ap.play()
            }
        }, 500);
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/pjax/pjax.min.js"></script>
<script>
    var pjax = new Pjax({
        selectors: [
            ".main-container", ".js-Pjax", "Timer"
        ]
    })

    pjax._handleResponse = pjax.handleResponse;

    pjax.handleResponse = function (responseText, request, href, options) {
        if (request.responseText.match("<html")) {
            if (responseText) {
                // 将新页面的html字符串解析成DOM对象
                let newDom = new DOMParser().parseFromString(responseText, 'text/html');
                // 获取新页面中body的className，并设置回当前页面
                let bodyClass = newDom.body.className;
                document.body.setAttribute("class", bodyClass)
            }
            // 放行，交给pjax自己处理
            pjax._handleResponse(responseText, request, href, options);
        } else {
            // handle non-HTML response here
        }
    }

    async function renderKaTeX() {
        // 判断当前页面是否有KateX
        let katex = document.querySelector(".math-katex");
        if (!katex) {
            return;
        }
        // 等待函数加载成功后，再执行渲染方法
        while (typeof renderMathInElement !== 'function') {
            await delay(500);
        }
        // KaTeX渲染方法
        renderMathInElement(document.body, {
            delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\(", right: "\\)", display: false },
                { left: "\\[", right: "\\]", display: true }
            ],
            ignoredClasses: ["gist"]
        });
    }

    /**
     * 同步延迟
     */
    function delay(time) {
        return new Promise(resolve => {
            setTimeout(resolve, time)
        })
    }

    document.addEventListener('pjax:send', () => {
        // 显示顶部进度条
        topbar.show();
    })

    document.addEventListener('pjax:complete', () => {
        // 去掉 URL 中的时间戳查询参数
        let url = new URL(window.location.href);
        url.searchParams.delete('t');  // 删除 `t` 参数
        history.replaceState(null, '', url.toString());  // 更新 URL 不刷新页面
        renderKaTeX();
        // Stack脚本初始化
        window.Stack.init();
        topbar.hide();
        // 加载Giscus评论脚本
    })
</script>

<div class="js-Pjax">
    <script>
            (function () {
                // 判断当前是否有文章评论标识
                let comment = document.querySelector(".comment");
                if (!comment) {
                    return;
                }
                function injectGiscusScript() {
                    let script = document.createElement('script');
                    // 将对应评论的脚本内容填进去
                    script.setAttribute('src', 'https://giscus.app/client.js');
                    script.setAttribute('data-repo', '{{- .repo -}}');
                    script.setAttribute('data-repo-id', '{{- .repoID -}}');
                    script.setAttribute('data-category', '{{- .category -}}');
                    script.setAttribute('data-category-id', '{{- .categoryID -}}');
                    script.setAttribute('data-mapping', '{{- default `title` .mapping -}}');
                    script.setAttribute('data-strict', '{{- default 0 .strict -}}');
                    script.setAttribute('data-reactions-enabled', '{{- default 1 .reactionsEnabled -}}');
                    script.setAttribute('data-emit-metadata', '{{- default 0 .emitMetadata -}}');
                    script.setAttribute('data-input-position', '{{- default `top` .inputPosition -}}');
                    script.setAttribute('data-theme', '{{- default `light` .lightTheme -}}');
                    script.setAttribute('data-lang', '{{- default `en` .lang -}}');
                    script.setAttribute('data-loading', 'lazy');
                    script.setAttribute('crossorigin', 'anonymous');
                    script.async = true;

                    // 重新注入评论脚本到页面
                    let footer = document.querySelector('.site-footer');
                    if (footer) {
                        footer.before(script);
                    }
                }

                // 初次加载时注入
                injectGiscusScript();

                // 监听 PJAX 更新后重新注入
                document.addEventListener('pjax:complete', function () {
                    injectGiscusScript();
                });
            })(document);
    </script>

        <div class="Timer">
            <!-- Add blog running time -->
            <script>
                function updateRunningDays() {
                    let s1 = '2025-6-23'; //website start date
                    s1 = new Date(s1.replace(/-/g, "/"));
                    let s2 = new Date();
                    let timeDifference = s2.getTime() - s1.getTime();

                    let days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
                    let hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    let minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));

                    let result = days + "天" + hours + "小时" + minutes + "分钟";
                    const elem = document.getElementById('runningdays');
                    if (elem) elem.innerHTML = result;
                }

                updateRunningDays();

                document.addEventListener('pjax:complete', function () {
                    updateRunningDays();
                });
            </script>

                    function decrypt() {
                        const pwd = document.getElementById("pwd").value;
                        const box = document.getElementById("encrypt-box");
                        const content = document.getElementById("post-content");

                        if (pwd === "260104") { // 这里设置你的文章密码

                            content.style.display = "block";
                        } else {
                            alert("密码错误");
                        }
                    }

                    // 允许回车解密
                    document.addEventListener("keydown", e => {
                        if (e.key === "Enter" && document.getElementById("pwd")) decrypt();
                    });
                </script>

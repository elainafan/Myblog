<script>
(() => {
    document.querySelectorAll('[data-cf-dashboard]').forEach((root) => {
        const search = root.querySelector('[data-cf-search]');
        const div = root.querySelector('[data-cf-div]');
        const status = root.querySelector('[data-cf-status]');
        const perf = root.querySelector('[data-cf-perf]');
        const cards = [...root.querySelectorAll('[data-cf-card]')];
        const empty = root.querySelector('[data-cf-empty]');

        const apply = () => {
            const keyword = (search?.value || '').trim().toLowerCase();
            const divValue = div?.value || 'all';
            const statusValue = status?.value || 'all';
            const perfValue = perf?.value || 'all';
            let shown = 0;

            cards.forEach((card) => {
                const okKeyword = !keyword || (card.dataset.search || '').includes(keyword);
                const okDiv = divValue === 'all' || card.dataset.div === divValue;
                const okStatus = statusValue === 'all' || card.dataset.status === statusValue;
                const okPerf = perfValue === 'all' || card.dataset.perf === perfValue;
                const visible = okKeyword && okDiv && okStatus && okPerf;
                card.classList.toggle('is-hidden', !visible);
                if (visible) shown += 1;
            });

            if (empty) empty.classList.toggle('is-hidden', shown !== 0);
        };

        [search, div, status, perf].forEach((control) => {
            if (control) control.addEventListener('input', apply);
            if (control) control.addEventListener('change', apply);
        });
        apply();
    });
})();
</script>

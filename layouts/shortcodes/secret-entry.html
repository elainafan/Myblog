{{- $href := .Get "href" | default "#" -}}
{{- $label := .Get "label" | default "打开页面" -}}
{{- $caption := .Get "caption" | default "" -}}
<div class="secret-entry">
    <a class="secret-entry__button" href="{{ $href | relURL }}">{{ $label }}</a>
    {{- with $caption }}
    <p class="secret-entry__caption">{{ . }}</p>
    {{- end }}
</div>

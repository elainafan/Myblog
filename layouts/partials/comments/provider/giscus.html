{{- with .Site.Params.comments.giscus -}}
<template data-giscus>
    <giscus-widget
        repo="{{ .repo }}" repoid="{{ .repoID }}"
        category="{{ .category }}" categoryid="{{ .categoryID }}"
        mapping="{{ default `title` .mapping }}" strict="{{ default 0 .strict }}"
        reactionsenabled="{{ default 1 .reactionsEnabled }}" emitmetadata="{{ default 0 .emitMetadata }}"
        inputposition="{{ default `top` .inputPosition }}" lang="{{ default `en` .lang }}"
        data-light-theme="{{ default `light` .lightTheme }}" data-dark-theme="{{ default `dark_dimmed` .darkTheme }}"
        loading="lazy"></giscus-widget>
</template>
{{- end -}}
